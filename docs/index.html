  if (part === whole) return "100 %";
  if (!part) return "0 %";
  return `${Math.min(Math.max(100 * part / whole, 0.1), 99.9).toFixed(1)} %`;
}

// --- small DOM helpers: text always goes in through textContent, never innerHTML ----
function el(tag, attrs, ...children) {
  const node = document.createElement(tag);
  for (const [key, value] of Object.entries(attrs || {})) {
    if (key === "style") Object.assign(node.style, value);
    else node.setAttribute(key, value);
  }
  for (const child of children.flat()) {
    if (child === null || child === undefined) continue;
    node.append(child instanceof Node ? child : document.createTextNode(String(child)));
  }
  return node;
}

function table(headers, rows, numeric) {
  const head = el("tr", {}, headers.map((h, i) => el("th", numeric[i] ? { class: "num" } : {}, h)));
  const body = rows.map(row =>
    el("tr", {}, row.map((cell, i) => el("td", numeric[i] ? { class: "num" } : {}, cell))));
  return el("div", { class: "table-wrap" }, el("table", {}, el("thead", {}, head), el("tbody", {}, body)));
}

function theme() {
  const css = getComputedStyle(document.documentElement);
  const v = name => css.getPropertyValue(name).trim();
  return {
    surface: v("--surface"), ink: v("--ink"), ink2: v("--ink-2"), muted: v("--muted"),
    grid: v("--grid"), axis: v("--axis"), border: v("--border"),
    series1: v("--series-1"), series2: v("--series-2"),
  };
}

// --- Plotly layout shared by every chart -------------------------------------------
function layout(t, overrides) {
  const axis = extra => Object.assign({
    gridcolor: t.grid, linecolor: t.axis, zeroline: false, showline: true,
    tickfont: { color: t.muted }, title: { font: { color: t.ink2, size: 12 } },
    automargin: true, fixedrange: true,
  }, extra);
  const o = overrides || {};
  return Object.assign({
    paper_bgcolor: t.surface, plot_bgcolor: t.surface,
    font: { family: FONT, size: 12, color: t.ink2 },
    margin: { l: 8, r: 24, t: 8, b: 8 },
    hoverlabel: { bgcolor: t.surface, bordercolor: t.axis, font: { family: FONT, color: t.ink } },
    showlegend: false, bargap: 0.45, separators: ".,",
  }, o, { xaxis: axis(o.xaxis), yaxis: axis(o.yaxis) });
}

function columns(t, labels, values, unit, extraLayout) {
  return {
    traces: [{
      type: "bar", x: labels, y: values,
      marker: { color: t.series1, cornerradius: 4 },
      hovertemplate: `%{x}: %{y:,} ${unit}<extra></extra>`,
    }],
    layout: layout(t, Object.assign({
      xaxis: { showgrid: false, type: "category" },
      yaxis: { tickformat: "~s" },
    }, extraLayout)),
  };
}

function bars(t, labels, values, unit, valueText) {
  return {
    traces: [{
      type: "bar", orientation: "h", y: labels, x: values,
      marker: { color: t.series1, cornerradius: 4 },
      text: values.map(valueText || (v => compact.format(v))),
      textposition: "outside", cliponaxis: false,
      textfont: { color: t.ink2, size: 12 },
      hovertemplate: `%{y}: %{x:,} ${unit}<extra></extra>`,
    }],
    layout: layout(t, {
      yaxis: { autorange: "reversed", showgrid: false, ticks: "", showline: false,
               tickfont: { color: t.ink2 } },
      xaxis: { tickformat: "~s", showline: false },
      margin: { l: 8, r: 48, t: 8, b: 8 },
    }),
  };
}

// --- the cards ---------------------------------------------------------------------
const T = DATA.totals[0];
const conc = DATA.review_concentration;
const share = p => (conc.find(r => r.top_percent_of_games === p) || {}).percent_of_reviews;

const CHARTS = [
  {
    id: "releases", title: "Releases per year",
    about: "Games released each year. The last year is partial: the data is a snapshot.",
    plot: t => columns(t, DATA.releases_per_year.map(r => String(r.year)),
                       DATA.releases_per_year.map(r => r.games), "games"),
    table: () => table(["Year", "Games"],
                       DATA.releases_per_year.map(r => [r.year, fmt.format(r.games)]), [0, 1]),
  },
  {
    id: "prices", title: "Price bands",
    about: "Games per price band, in USD on the scrape day.",
    plot: t => {
      const chart = columns(t, DATA.price_bands.map(r => r.band),
                            DATA.price_bands.map(r => r.games), "games");
      Object.assign(chart.traces[0], {
        text: DATA.price_bands.map(r => compact.format(r.games)),
        textposition: "outside", cliponaxis: false, textfont: { color: t.ink2, size: 12 },
      });
      return chart;
    },
    table: () => table(["Price", "Games"],
                       DATA.price_bands.map(r => [r.band, fmt.format(r.games)]), [0, 1]),
  },
  {
    id: "free", title: "Free and paid games",
    about: "Share of games with a price of 0 on the scrape day.",
    custom: t => freePaid(t),
    table: () => table(["Kind", "Games"],
                       [["Free", fmt.format(T.free_games)], ["Paid", fmt.format(T.paid_games)]],
                       [0, 1]),
  },
  {
    id: "platforms", title: "Platforms",
    about: "Share of games that run on each platform. A game can run on several.",
    plot: t => {
      const labels = DATA.platforms.map(r => pct(r.games, T.games));
      const chart = bars(t, DATA.platforms.map(r => r.platform),
                         DATA.platforms.map(r => 100 * r.games / T.games), "%",
                         (v, i) => labels[i]);
      chart.traces[0].customdata = labels;
      chart.traces[0].hovertemplate = "%{y}: %{customdata} of games<extra></extra>";
      chart.layout.xaxis.range = [0, 110];
      chart.layout.xaxis.ticksuffix = " %";
      chart.layout.xaxis.tickformat = "";
      return chart;
    },
    height: 200,
    table: () => table(["Platform", "Games", "Share"],
                       DATA.platforms.map(r => [r.platform, fmt.format(r.games), pct(r.games, T.games)]),
                       [0, 1, 1]),
  },
  {
    id: "tags", title: "Top tags by votes", tall: true,
    about: "The 15 user tags with the most player votes, summed over all games.",
    plot: t => bars(t, DATA.top_tags.map(r => r.tag), DATA.top_tags.map(r => r.votes), "votes"),
    table: () => table(["Tag", "Votes", "Games"],
                       DATA.top_tags.map(r => [r.tag, fmt.format(r.votes), fmt.format(r.games)]),
                       [0, 1, 1]),
  },
  {
    id: "genres", title: "Top genres", tall: true,
    about: "The 15 genres with the most games.",
    plot: t => bars(t, DATA.top_genres.map(r => r.genre), DATA.top_genres.map(r => r.games), "games"),
    table: () => table(["Genre", "Games"],
                       DATA.top_genres.map(r => [r.genre, fmt.format(r.games)]), [0, 1]),
  },
  {
    id: "languages", title: "Top languages", tall: true,
    about: "The 15 languages supported by the most games.",
    plot: t => bars(t, DATA.top_languages.map(r => r.language),
                    DATA.top_languages.map(r => r.games), "games"),
    table: () => table(["Language", "Games", "Full audio"],
                       DATA.top_languages.map(r => [r.language, fmt.format(r.games),
                                                    fmt.format(r.full_audio)]), [0, 1, 1]),
  },
  {
    id: "concentration", title: "Review concentration", tall: true,
    about: `The top 1 % of games hold ${share(1)} % of all reviews, the top 10 % hold ${share(10)} %.`,
    plot: t => concentration(t),
    table: () => table(["Top games", "Share of all reviews"],
                       [1, 5, 10, 25, 50].map(p => [`${p} %`, `${share(p)} %`]), [0, 1]),
  },
];

function freePaid(t) {
  const total = T.free_games + T.paid_games;
  const parts = [["Paid", T.paid_games, t.series1], ["Free", T.free_games, t.series2]];
  const bar = el("div", { class: "segbar", role: "img",
    "aria-label": parts.map(([n, v]) => `${n}: ${fmt.format(v)} games, ${pct(v, total)}`).join("; ") });
  for (const [name, value, color] of parts) {
    const share = pct(value, total);
    const seg = el("div", { class: "segment", title: `${name}: ${fmt.format(value)} games (${share})`,
                            style: { background: color, flex: `${value} 1 0` } });
    seg.textContent = share;
    bar.append(seg);
  }
  const legend = el("div", { class: "legend" },
    parts.map(([name, , color]) => el("span", {}, el("span", { class: "swatch", style: { background: color } }), name)));
  return [bar, legend];
}

function concentration(t) {
  const x = [0, ...conc.map(r => r.top_percent_of_games)];
  const y = [0, ...conc.map(r => r.percent_of_reviews)];
  return {
    traces: [
      { type: "scatter", mode: "lines", x: [0, 100], y: [0, 100], hoverinfo: "skip",
        line: { color: t.axis, width: 1 } },
      { type: "scatter", mode: "lines", x, y, line: { color: t.series1, width: 2, shape: "spline" },
        hovertemplate: "Top %{x} % of games hold %{y:.1f} % of reviews<extra></extra>" },
      { type: "scatter", mode: "markers", x: [1], y: [share(1)], hoverinfo: "skip",
        marker: { size: 10, color: t.series1, line: { width: 2, color: t.surface } } },
    ],
    layout: layout(t, {
      hovermode: "x",
      xaxis: { title: { text: "Top % of games, ranked by reviews" }, ticksuffix: " %",
               range: [0, 100], showspikes: true, spikemode: "across", spikethickness: 1,
               spikecolor: t.axis, spikedash: "solid" },
      yaxis: { title: { text: "Share of all reviews" }, ticksuffix: " %", range: [0, 102] },
      annotations: [
        { x: 1, y: share(1), xanchor: "left", yanchor: "top", xshift: 10, yshift: -4,
          text: `Top 1 %: ${share(1)} % of reviews`, showarrow: false,
          font: { color: t.ink, size: 12 } },
        { x: 92, y: 92, xanchor: "right", yanchor: "bottom", yshift: 6,
          text: "equal share line", showarrow: false, font: { color: t.muted, size: 11 } },
      ],
    }),
  };
}

// --- data quality card ----------------------------------------------------------------
const STATUS = {
  ok: ["--good", "✓", "OK"], pass: ["--good", "✓", "pass"], warn: ["--warning", "!", "warn"],
  FAIL: ["--critical", "✕", "FAIL"], ERROR: ["--critical", "✕", "ERROR"], skip: ["--muted", "–", "skip"],
  valid: ["--good", "✓", "valid"], invalid: ["--critical", "✕", "violated"],
  problems: ["--critical", "✕", "Problems found"],
};

function status(kind, label) {
  const [color, icon, text] = STATUS[kind] || ["--muted", "?", kind];
  return el("span", { class: "status" },
    el("span", { class: "status-dot", style: { background: `var(${color})` } }),
    `${icon} ${label || text}`);
}

function qaCard() {
  const qa = DATA.qa, c = qa.checks;
  const head = el("div", { class: "qa-head" },
    el("span", { class: "qa-state" }, status(qa.ok ? "ok" : "problems", qa.ok ? "Data quality OK" : null)),
    el("span", { class: "about" },
       `${qa.constraints_valid} of ${qa.constraints} constraints valid · checks: ${c.pass} passed, ` +
       `${c.warn} warnings, ${c.FAIL} failed, ${c.ERROR} could not run, ${c.skip} skipped`));
  const checks = table(["Status", "Severity", "Rows", "Check", "About"],
    DATA.checks.map(r => [status(r.status), r.severity, r.failed === null ? "" : fmt.format(r.failed),
                          r.check, r.detail || r.about]), [0, 0, 1, 0, 0]);
  const constraints = table(["Status", "Constraint", "Table"],
    DATA.constraints.map(r => [status(r.valid ? "valid" : "invalid"), r.constraint_name, r.table_name]),
    [0, 0, 0]);
  return el("article", { class: "panel wide" },
    el("h2", {}, "Data quality"), head,
    el("details", {}, el("summary", {}, `Every check (${DATA.checks.length})`), checks),
    el("details", {}, el("summary", {}, `Every constraint (${DATA.constraints.length})`), constraints));
}

// --- page ------------------------------------------------------------------------------
function renderStatic() {
  document.getElementById("subtitle").textContent =
    `Generated ${DATA.generated} from the core model · Kaggle Steam Games Dataset · ${DATA.project} ${DATA.version}`;
  document.getElementById("hero-games").textContent = fmt.format(T.games);
  document.getElementById("hero-range").textContent = `Released ${T.first_release} to ${T.last_release}`;
  const tiles = [
    ["Developers", compact.format(T.developers)], ["Tags", fmt.format(T.tags)],
    ["Genres", fmt.format(T.genres)], ["Languages", fmt.format(T.languages)],
    ["Reviews", compact.format(T.reviews)],
    ["Free games", compact.format(T.free_games),
     `${pct(T.free_games, T.free_games + T.paid_games)} of priced games`],
  ];
  document.getElementById("tiles").append(...tiles.map(([label, value, note]) =>
    el("div", { class: "panel" }, el("div", { class: "tile-label" }, label),
       el("div", { class: "tile-value" }, value), note ? el("div", { class: "tile-note" }, note) : null)));

  const cards = document.getElementById("cards");
  cards.append(qaCard());
  for (const chart of CHARTS) {
    const area = el("div", { class: chart.tall ? "chart tall" : "chart", id: `chart-${chart.id}` });
    if (chart.height) area.style.height = `${chart.height}px`;
    if (chart.custom) area.style.height = "auto";
    cards.append(el("article", { class: "panel" },
      el("h2", {}, chart.title), el("p", { class: "about" }, chart.about), area,
      el("details", {}, el("summary", {}, "Table"), chart.table())));
  }
}

function renderCharts() {
  const t = theme();
  for (const chart of CHARTS) {
    const area = document.getElementById(`chart-${chart.id}`);
    if (chart.custom) {
      area.replaceChildren(...chart.custom(t));
    } else if (typeof Plotly === "undefined") {
      area.replaceChildren(el("div", { class: "chart-missing" },
        "The chart needs Plotly.js from cdn.plot.ly. The table below has the same numbers."));
      area.style.height = "auto";
    } else {
      const { traces, layout: lay } = chart.plot(t);
      Plotly.react(area, traces, lay, { displayModeBar: false, responsive: true });
    }
  }
}

renderStatic();
renderCharts();
window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", renderCharts);
</script>
